name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is .cljk. `clojure -M:test` found none of it and reported
    # "Ran 0 tests" as success; the whole suite now runs on kbb (root
    # ADR-2610100200), tool-driven tests included, and fewer than the 124 tests
    # measured on 2026-10-10 fails here, as does any failure or error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoba-lang/setup-kbb@a4586e48c72c69229ff1237a1246de63583b607d
      # The suite shells out to the pinned official tooling for real encode and
      # execute checks. Without them 24 tests error out instead of failing --
      # which is exactly how the first CI run on this branch looked. They had
      # only ever passed because the developer machine happened to have both on
      # PATH; nothing in the repo installed or checked for them.
      # wasm-tools is version-pinned in src/kotoba/wasm/tools.cljk
      # (assert-version!), so pin it here to the same 1.243.0.
      - name: Install pinned wasm-tools and wasmtime
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.wasm-bin"
          curl -sSfL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.243.0/wasm-tools-1.243.0-x86_64-linux.tar.gz \
            | tar -xz -C "$HOME/.wasm-bin" --strip-components=1 --wildcards '*/wasm-tools'
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v42.0.1/wasmtime-v42.0.1-x86_64-linux.tar.xz \
            | tar -xJ -C "$HOME/.wasm-bin" --strip-components=1 --wildcards '*/wasmtime'
          echo "$HOME/.wasm-bin" >> "$GITHUB_PATH"
      - run: wasm-tools --version && wasmtime --version
      - name: kbb -M:test
        run: |
          set -o pipefail
          kbb -M:test 2>&1 | tee kbb-test.log
          line=$(grep -E '^kbb test: [0-9]+ test\(s\), [0-9]+ pass, 0 fail, 0 error$' kbb-test.log)
          tests=$(echo "$line" | sed -E 's/^kbb test: ([0-9]+) test.*/\1/')
          test "$tests" -ge 124

  # This repo's own suite passing is not enough: it is a library whose only
  # compiler consumer is kotoba-lang/amu (formerly kotoba-lang/compiler), and a
  # change can be green here while breaking amu's dual-backend conformance.
  # That happened on 2026-07-30 (kotoba-wasm f4d7afb: green here, 47/52 there),
  # which is why this job exists.
  #
  # 2026-08-04 run 30898613513 failed after clone succeeded: this checkout
  # requires kotoba.kir.descriptor, and amu's kotoba-kir pin at the time did
  # not yet have that namespace. Do not treat a skipped consumer job as green.
  consumer-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dep
      - name: Check out the consumer
        run: git clone --depth 1 https://github.com/kotoba-lang/amu amu
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Amu dual-backend conformance against this checkout
        working-directory: amu
        run: |
          clojure -Sdeps "{:aliases {:dep {:override-deps {io.github.kotoba-lang/${{ github.event.repository.name }} {:local/root \"../dep\"}}}}}" \
            -M:dep:conformance
